<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ba3a3"/>
      <stop offset="50%" stop-color="#c4a47c"/>
      <stop offset="100%" stop-color="#d4a24a"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="16" fill="#0a0a08"/>
  <!-- Gradient accent bar -->

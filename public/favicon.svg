  <!-- Serif "D" letterform -->
  <text x="64" y="84" text-anchor="middle" font-family="'Instrument Serif', 'Georgia', serif" font-size="82" font-weight="400" fill="#ede8df" letter-spacing="-2">D</text>
</svg>
